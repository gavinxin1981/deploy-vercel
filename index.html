<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f7f6;
        }

        /* 导航栏 */
        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #1abc9c;
        }

        /* 巨幕横幅 */
        .hero {
            background: linear-gradient(135deg, #1abc9c, #2c3e50);
            color: #fff;
            padding: 5rem 2rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            background-color: #e74c3c;
            color: #fff;
            padding: 0.75rem 2rem;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #c0392b;
        }

        /* 主体内容区 */
        .container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1rem;
        }

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .card {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin-bottom: 1rem;
            color: #2c3e50;
        }

        /* 页脚 */
        footer {
            background-color: #34495e;
            color: #fff;
            text-align: center;
            padding: 1.5rem;
            margin-top: 5rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <header>
        <div class="logo">🚀 创作者空间</div>
        <nav>
            <a href="#home">首页</a>
            <a href="#features">特色</a>
            <a href="#about">关于</a>
        </nav>
    </header>

    <!-- 欢迎横幅 -->
    <section class="hero" id="home">
        <h1>欢迎来到我的纯 HTML 网页</h1>
        <p>这是一个现代化、自适应屏幕大小、无任何外部依赖的精美单页模板。</p>
        <a href="#features" class="btn">探索更多</a>
    </section>

    <!-- 核心功能/特点展示 -->
    <main class="container" id="features">
        <h2 style="text-align: center; margin-bottom: 1rem; color: #2c3e50;">核心优势</h2>
        <div class="services">
            <div class="card">
                <h3>⚡ 纯净高效</h3>
                <p>零外部框架依赖，加载速度极快，代码结构清晰易懂。</p>
            </div>
            <div class="card">
                <h3>📱 响应式设计</h3>
                <p>完美适配手机、平板和电脑屏幕，提供绝佳的阅读体验。</p>
            </div>
            <div class="card">
                <h3>🎨 易于定制</h3>
                <p>你可以非常轻松地修改 CSS 颜色、字体或添加全新的 HTML 标签。</p>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer>
        <p>&copy; 2026 创作者空间. 保留所有权利。</p>
    </footer>

    <!-- 基础交互脚本 -->
    <script>
        // 点击按钮时弹出的简单互动
        document.querySelector('.btn').addEventListener('click', function(e) {
            console.log('用户点击了探索按钮');
        });
    </script>
</body>
</html>
